name: 18 - 3 - Reusable Workflows

on: 
  workflow_dispatch:

jobs:     
  deploy:
    uses: ./.github/workflows/18-1-reusable-workflows.yaml
    with: 
        target-directory: pathhhhhhh

  print-outputs:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
        - name: Print outputs
          run: |
            echo "Build status: ${{ needs.deploy.outputs.build-status }}"
            echo "URL: ${{ needs.deploy.outputs.url }}"
  e2e-tests:
    needs: print-outputs
    uses: "Dev-Sec-ML-AI-Ops/github-actions-course-example-e2e/.github/workflows/e2e.yaml@main"