name: HR Leave Management Clean CI/CD

on:
  push:
    branches: [main]
    paths:
      - "HR.LeaveManagement.Clean/**"
      - ".github/workflows/HR-LeaveManagement-Clean.yaml"
  pull_request:
    branches: [main]
    paths:
      - "HR.LeaveManagement.Clean/**"
      - ".github/workflows/HR-LeaveManagement-Clean.yaml"
  workflow_dispatch:

concurrency:
  group: hr-leavemanagement-clean-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: HR.LeaveManagement.Clean/HR.LeaveManagement.Clean.sln
  API_PROJECT_PATH: HR.LeaveManagement.Clean/HR.LeaveManagement.Api/HR.LeaveManagement.Api.csproj
  BUILD_CONFIGURATION: Release
  PUBLISH_DIR: ./publish

jobs:
  build-test-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: List .NET SDK
        run: dotnet --list-sdks 

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('HR.LeaveManagement.Clean/**/*.csproj', 'HR.LeaveManagement.Clean/**/*.props', 'HR.LeaveManagement.Clean/**/*.targets', 'HR.LeaveManagement.Clean/HR.LeaveManagement.Clean.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Clean solution
        run: dotnet clean ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run unit and integration tests
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish API project
        run: >
          dotnet publish ${{ env.API_PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --output ${{ env.PUBLISH_DIR }}

      - name: Upload published artifact
        uses: actions/upload-artifact@v6
        with:
          name: hr-leavemanagement-clean-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hr-leavemanagement-clean-test-results
          path: ./TestResults
          if-no-files-found: warn
          retention-days: 7

