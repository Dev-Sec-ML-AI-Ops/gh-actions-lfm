name: 06 - Contexts
# run-name: My custom workflow run name - ${{ runner.os }} -- Wrong
# run-name is evaluated before any job starts
# At that time, runner context does NOT exist yet
run-name: 06 - Contexts | DEBUG - ${{ inputs.debug }}
on: 
  workflow_dispatch:
      inputs:
        debug: 
          type: boolean
          default: false
env:
  MY_WORKFLOW_VAR: 'workflow'
  MY_OVERWRITTEN_VAR: 'workflow'
jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
      MY_JOB_VAR: 'job'
      MY_OVERWRITTEN_VAR: 'job'
    steps:
        - name: Display Information
          run: |
            echo "Event name: ${{ github.event_name }}"
            echo "Ref: ${{ github.ref }}"
            echo "SHA: ${{ github.sha }}"
            echo "Actor: ${{github.actor}}"
            echo "Workflow: ${{github.workflow}}"
            echo "Run ID: ${{github.run_id}}"
            echo "Run number: ${{github.run_number}}"

        - name: Retrieve Variable
          run: echo ${{vars.MY_VAR}}
        
        - name: Print Env Variables
          env: 
            MY_OVERWRITTEN_VAR: 'step'
          run: |
            echo "Workflow env: ${{env.MY_WORKFLOW_VAR}} "
            echo "Overwritten env: ${{env.MY_OVERWRITTEN_VAR}}"
            echo "Job env: ${{env.MY_JOB_VAR}}"

        - name: Print Env Variables 2
          run: |
            echo "Workflow env: ${{env.MY_WORKFLOW_VAR}} "
            echo "Overwritten env: ${{env.MY_OVERWRITTEN_VAR}}"
            echo "Job env: ${{env.MY_JOB_VAR}}"

  Second-job:
    runs-on: ubuntu-latest
    steps:
        - name: Print Env Variables
          run: |
            echo "Workflow env: ${{env.MY_WORKFLOW_VAR}} or $MY_WORKFLOW_VAR"
            echo "Overwritten env: ${{env.MY_OVERWRITTEN_VAR}} or $MY_OVERWRITTEN_VAR"
            echo "Job env: ${{env.MY_JOB_VAR}}"