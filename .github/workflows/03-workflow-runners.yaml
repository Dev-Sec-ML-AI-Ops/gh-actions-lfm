name: 01 - Workflow Events
on: 
  push:
  workflow_dispatch:
jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
        - name: Show OS
          run: |
            echo "This job is running on an $RUNNER_OS."
  windows-echo:
    runs-on: windows-latest
    steps:
        - name: Show OS
          run: |
            echo "This job is running on a $RUNNER_OS."
  mac-echo:
    runs-on: macos-latest
    steps:
        - name: Show OS
          run: |
            echo "This job is running on a $RUNNER_OS."