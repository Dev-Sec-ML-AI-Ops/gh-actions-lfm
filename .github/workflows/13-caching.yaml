name: 13 - Using Caching
run-name: Using Caching - ${{ inputs.use-cache && 'ON' || 'OFF'}}
on: 
  pull_request:
  workflow_dispatch:
    inputs:
        use-cache: 
            type: boolean
            description: Whether to execute cache step
            default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: 13-caching/react-app
    steps:
        - name: Checkout code
          uses: actions/checkout@v6
        - name: Setup Node
          uses: actions/setup-node@v6
          with:
            node-version: '24.x'
        - name: Install Dependencies
          run: npm ci
        - name: Testing
          run: npm run test
        - name: Building
          run: npm run build
        - name: Deploying to nonprod
          run: echo Deploying to nonprod.