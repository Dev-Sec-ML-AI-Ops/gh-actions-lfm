name: 13 - Using Caching
run-name: Using Caching - ${{ inputs.use-cache && 'ON' || 'OFF'}}
on: 
  pull_request:
  workflow_dispatch:
    inputs:
        use-cache: 
            type: boolean
            description: Whether to execute cache step
            default: true
        node-version:
            type: choice
            options:
             - 18.x
             - 20.x
             - 22.x
             - 24.x
            description: Node version
            default: 24.x
env:
      NODE_VERSION: ${{ inputs.node-version || '24.x' }}
jobs:
  install-deps:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: 13-caching/react-app
    outputs:
        deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Calulate cache key
        id: cache-key
        run: |
            echo "CACHE_KEY=deps-node-modules-${{ env.NODE_VERSION }}-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Download cached dependencies
        id: cache
        uses: actions/cache@v5
        if: ${{ inputs.use-cache }}
        with:
          path: "13-caching/react-app/node_modules"
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  build:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults: 
      run:
        working-directory: 13-caching/react-app
    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Setup Node
          uses: actions/setup-node@v6
          with:
            node-version: ${{ env.NODE_VERSION }}

        - name: Download cached dependencies
          id: cache
          if: ${{ inputs.use-cache }}
          uses: actions/cache@v5
          with:
            path: "13-caching/react-app/node_modules"
            key: ${{ needs.install-deps.outputs.deps-cache-key }}

        - name: Testing
          run: npm run test

        - name: Building
          run: npm run build

        - name: Deploying to nonprod
          run: echo Deploying to nonprod.