name: 02 - Workflow Events
on: 
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, milestoned]
  issue_comment:
    types: [created, deleted]
  label:
    types: [created, deleted]
jobs:
  Event-Name:
    runs-on: ubuntu-latest
    steps:
        - name: Event name
          run: |
            echo "Event name: ${{ github.event_name }}"