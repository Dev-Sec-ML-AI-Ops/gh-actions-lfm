name: 01 - Workflow Events
on: 
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * * *'
  workflow_dispatch:
jobs:
  Event-Name:
    runs-on: ubuntu-latest
    steps:
        - name: Event name
          run: |
            echo "Event name: ${{ github.event_name }}"