name: 14 - Working with Artifacts
run-name: Using Artifacts on Node Version - ${{ inputs.node-version }}
on: 
  pull_request:
  workflow_dispatch:
    inputs:
        node-version:
            type: choice
            options:
             - 18.x
             - 20.x
             - 22.x
             - 24.x
            description: Node version
            default: 24.x
env:
      NODE_VERSION: ${{ inputs.node-version || '24.x' }}
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: 14-artifacts/react-app
    steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Setup Node
          uses: actions/setup-node@v6
          with:
           node-version: ${{ env.NODE_VERSION }}
        - name: Download cached dependencies
          id: cache
          uses: actions/cache@v5
          with:
            path: "14-artifacts/react-app/node_modules"
            key: deps-node-modules-${{ hashFiles('14-artifacts/react-app/package-lock.json') }}
        - name: Install Dependencies
          if: steps.cache.outputs.cache-hit != 'true'
          run: npm ci
        - name: Unit tests
          run: npm run test
        - name: Build code
          run: npm run build
        - name: Upload build files
          uses: actions/upload-artifact@v6
          with:
            name: app
            path: 14-artifacts/react-app/build
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
        - name: Download Build Files
          uses: actions/download-artifact@v6
          with:
            name: app
            path: build

        - name: Show folder structure  
          run: ls -R 