name: 12 - Working with Outputs

on: 
  pull_request:
  workflow_dispatch:
    inputs:
        build-status: 
            type: choice
            options:
             - success
             - failure
            description: Setting build status
            default: success

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
        build-status-out: ${{steps.build.outputs.status}}
        output1: ${{steps.build.outputs.output1}}
        output2: ${{steps.build.outputs.output2}}
    steps:
        - name: Print GITHUB_OUTPUT path
          run: |
            echo GITHUB OUTPUT Path: "$GITHUB_OUTPUT"
        
        - name: Build
          id: build
          run: |
            echo status=${{ inputs.build-status }} >> "$GITHUB_OUTPUT"
            echo output1=value1 >> "$GITHUB_OUTPUT"
            echo output2=value2 >> "$GITHUB_OUTPUT"
            echo Printing GITHUB OUTPUT content
            echo 👇👇👇👇👇👇👇👇
            cat "$GITHUB_OUTPUT" 
            echo "mistake=true" > "$GITHUB_OUTPUT"
            echo Again Printing GITHUB OUTPUT content
            echo 👇👇👇👇👇👇👇👇
            cat "$GITHUB_OUTPUT" 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    if: ${{ contains(needs.build.outputs.build-status-out,'success')}}
       # Another way for string comparison ${{ needs.build.outputs.build-status-out == 'success'}}
    steps:
        - name: Deploy
          run: echo Deploying
        - name: Prints Outputs
          run: echo ${{needs.build.outputs.output1}}