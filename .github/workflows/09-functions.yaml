name: 09 - Using Functions
#run-name: 09 - Using Functions | DEBUG - ${{ inputs.debug && 'ON' || 'OFF'}}

on: 
  pull_request:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
        - name: Print PR title
          run: |
            echo PR Title: ${{ github.event.pull_request.title }}

        - name: Print PR labels
          run: |
            echo PR Label: ${{ github.event.pull_request.labels }}

        - name: Print PR labels using toJSON
          run: |
            echo PR Label: 
                cat << EOF
                ${{ toJSON(github.event.pull_request.labels) }}
                EOF
        
        - name: Print PR labels only
          run: |
                cat << EOF
                ${{ toJSON(github.event.pull_request.labels.*.name) }}
                EOF

        - name: Bug step
          if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
          run: |
            echo I am a bug fix

        - name: Sleep for 20 seconds
          run: sleep 20

        - name: Failing step
          run: exit 0 ## Success
          # exit 1 ## Failure

        - name: I will be skipped
          if: ${{ success() }}
          run: echo "I will print if previous steps succeed."

        - name: I will execute
          if: ${{ failure() }}
          run: echo "I will print if any previous step fails."
        
        - name: I will execute
          if: ${{ !cancelled() }}
          run: echo "I will always print, except when the workflow is cancelled."
        
        - name: I will execute when cancelled
          if: ${{ cancelled() }}
          run: echo "Print when workflow has been cancelled."
