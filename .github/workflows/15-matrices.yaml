name: 15 - Working with Matrices
on: 
  workflow_dispatch:
jobs:
  backwards-compatibility:
    name: ${{ matrix.os }}-${{ matrix.node }}
    strategy:
        matrix:
            node: [20.x, 22.x, 24.x]
            os: 
                - ubuntu-latest
                - macos-latest
                - windows-latest
            
    runs-on: ${{ matrix.os }}
    steps:
        - name: Setup node
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node }}

        - name: Perform some tests
          run: echo Running tests on OS <${{runner.os}}> or <${{matrix.os}}> and NodeJS <${{matrix.node}}>

