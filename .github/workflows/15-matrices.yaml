name: 15 - Working with Matrices
on: 
  workflow_dispatch:
jobs:
  backwards-compatibility:
    name: ${{ matrix.os }}-${{ matrix.node }}
    strategy:
        # disable fail-fast so all matrix jobs run even if one fails
        fail-fast: false # default true
        matrix:
            node: [20.x, 22.x, 24.x]
            os: 
                - ubuntu-latest
                - windows-latest
            include:
                - os: ubuntu-latest
                  node: 18.x
                - os: ubuntu-latest
                  node: 21.x
                  tag: experimental
    runs-on: ${{ matrix.os }}
    steps:
        - name: Setup node
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node }}
        
        - name: Fail if experimental
          if: matrix.tag == 'experimental'
          run: exit 1

        - name: Perform some tests
          run: |
           echo "Running tests on OS ${{matrix.os}} and NodeJS ${{matrix.node}}"
           sleep 10

        - name: Upload test results
          run: echo "Uploading tests"
    
  include-example:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            color: [red, green]
            shape: [circle , sqaure]
            size:
                - small
                - large
            include:
                - opacity: 50
                - color: red
                  shape: triangle
    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}
    steps:
        - name: Dummy step
          run: echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"


