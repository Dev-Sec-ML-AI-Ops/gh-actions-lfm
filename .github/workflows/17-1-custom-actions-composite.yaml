name: 17 - 1 - Custom Actions - Composite
run-name: 17 - 1 - Custom Actions - Composite | env - ${{ inputs.target-env }}
on: 
  pull_request:
  workflow_dispatch:
    inputs:
        target-env:
            type: choice
            options:
             - dev
             - staging
             - prod
            description: Environment
            default: dev
env:
    working-directory: 17-custom-actions/react-app
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: ${{ env.working-directory }}

    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Setup Node and NPM Dependencies
          uses: ./.github/actions/composite-cache-deps
          with:
            node-version: 22 
            working-dir: ${{ env.working-directory }}

        - name: Testing
          run: npm run test

        - name: Building
          run: npm run build

        - name: Deploying to ${{ inputs.target-env }}
          run: echo Deploying to ${{ inputs.target-env }}.