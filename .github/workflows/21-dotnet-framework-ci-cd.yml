name: 21 - .NET Framework CI/CD

on:
  workflow_dispatch:
  
env:
  SOLUTION_PATH: devsecops-dotnet-github-actions-end-to-end-assignment-master/SomeConsoleApplication.sln
  BUILD_CONFIGURATION: Release

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run unit tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core `
            -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe"
          
          if (-not $vstest) {
            throw "vstest.console.exe was not found on the runner."
          }

          & $vstest "devsecops-dotnet-github-actions-end-to-end-assignment-master\SomeConsoleApplicationTest\bin\${{ env.BUILD_CONFIGURATION }}\SomeConsoleApplicationTest.dll"
